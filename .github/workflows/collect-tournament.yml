name: Collect Tournament Games

# Pro games carry composition signal that ranked averages away: in the season-39
# set one trio accounted for 27 of 79 games. But the collector needed someone to
# know the current dak.gg game-id range and type it in, so nobody ran it, and
# src/tournamentMeta.js sat on 22 games while seasons rolled over.
#
# --auto pages through the published current-season listing. Gaps in tournament
# IDs cannot hide later events. Known games are reused; incomplete legacy rows
# are enriched once. Empty/changed listings fail without replacing existing data.

on:
  schedule:
    - cron: '15 6 * * *' # 06:15 UTC / 15:15 KST - clear of the other two workflows
  workflow_dispatch:

concurrency:
  group: collect-tournament-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Discover published tournament games
        id: collect
        run: |
          node tools/tournament_collector.mjs \
            --auto \
            --out data/tournament_s41.json \
            --delay 800
          if git diff --quiet -- data/tournament_s41.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild tournament meta
        if: steps.collect.outputs.changed == 'true'
        run: node tools/build_tournament_meta.mjs --in data/tournament_s41.json

      - name: Verify the module is not empty
        run: |
          # An empty or collapsed tournamentMeta silently zeroes the tournament term
          # for everyone, exactly like the pair-role table did.
          node --input-type=module -e '
            const { tournamentTotalGames, tournamentCharStats } = await import("./src/tournamentMeta.js");
            const { validTournamentData } = await import("./src/tournamentData.js");
            const { readFile } = await import("node:fs/promises");
            const compact = JSON.parse(await readFile("src/tournamentMeta.compact.json", "utf8"));
            if (!validTournamentData(compact)) throw new Error("Invalid tournament runtime data");
            const chars = Object.keys(tournamentCharStats ?? {}).length;
            if (!tournamentTotalGames || chars < 20) {
              console.error(`::error title=Tournament meta collapsed::games=${tournamentTotalGames} characters=${chars}`);
              process.exit(1);
            }
            console.log(`tournament meta ok: ${tournamentTotalGames} games, ${chars} characters`);
          '

      - name: Refresh recommendation baseline
        if: steps.collect.outputs.changed == 'true'
        run: node tools/recommendation_snapshot.mjs --update

      - name: Commit results
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournament_s41.json src/tournamentMeta.js src/tournamentMeta.compact.json snapshots/recommendation-baseline.json
          if git diff --staged --quiet; then
            echo "No new tournament games"
          else
            git commit -m "chore: update tournament games [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              # The baseline was generated against the code this run checked out, which
              # can be older than what it now sits on: c97f17a landed a baseline built
              # with officialV2Weight 0 on top of a main that had already moved it to
              # 0.4, so the committed baseline did not match the committed code.
              # Regenerate after the rebase, when the tree is the tree that ships.
              node tools/recommendation_snapshot.mjs --update
              git add snapshots/recommendation-baseline.json
              git diff --staged --quiet || git commit --amend --no-edit
              if git push origin main; then pushed=1; break; fi
              echo "push attempt $attempt failed; retrying..."
              sleep 5
            done
            [ "$pushed" -eq 1 ] || { echo "could not push after retries" >&2; exit 1; }
          fi
