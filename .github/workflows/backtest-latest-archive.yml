name: backtest-latest-archive

on:
  workflow_dispatch:
  schedule:
    - cron: "35 20 * * *"

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      DATA_REPO: latte4today/ER-Team-Picker-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate durable data archive access
        shell: bash
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error title=Missing DATA_REPO_TOKEN::Add the repository secret DATA_REPO_TOKEN with Contents read access to $DATA_REPO."
            exit 1
          fi

          status=$(curl -L -sS -o /tmp/data-repo.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DATA_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DATA_REPO")

          if [ "$status" != "200" ]; then
            message=$(node -e "try{const r=require('/tmp/data-repo.json'); console.log(r.message || 'Unknown GitHub API error')}catch{console.log('Unknown GitHub API error')}")
            echo "::error title=Data archive authentication failed::$DATA_REPO could not be accessed (HTTP $status: $message). Replace DATA_REPO_TOKEN with the current fine-grained token."
            exit 1
          fi

      - name: Checkout durable data archive
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ env.DATA_REPO_TOKEN }}
          path: data-repo
          fetch-depth: 1

      - name: Validate pair synergy contract
        run: npm run check-pair-synergy-lift

      - name: Backtest latest durable archive
        run: |
          node tools/backtest_latest_archive.mjs \
            --no-sync \
            --archive-dir data-repo/official-archive \
            --out reports/generated/latest-official-archive.jsonl \
            --configs lean,lean_deficit,lean_deficit_hi_022,lean_deficit_hi_028,lean_deficit_hi_034 \
            --metric concordance \
            --games 1500 \
            --scan 250000 \
            --team-tier meteor_mithril,demigod_eternity \
            --seed 1 \
            --bootstrap 500 \
            --ci-baseline lean

      - name: Upload validation corpus manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: latest-archive-backtest-input
          retention-days: 30
          path: |
            reports/generated/latest-official-archive.manifest.json
          if-no-files-found: ignore
